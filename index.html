<title>ママへの思い</title>
<script>
/* ================================================================
   曲の一覧（ここだけ直せば曲が増えます）
   1曲 = { title: 曲名, video: 動画ファイル, cover: 表紙の画像 }
   1曲目が主役（表紙いっぱい＋大きな「見る」ボタン）。
   2曲目からは、その下に小さめの「もう1曲」カードとして並びます。
   ================================================================ */
const SONGS = [
  { title: "ママへの思い", video: "assets/video/01.mp4?v=7d7b2a4a", cover: "assets/covers/01.jpg" },
  { title: "dear", video: "assets/video/02.mp4?v=3e30eeef", cover: "assets/covers/02.jpg", thumb: "assets/covers/02-thumb.jpg" },
];

/* アプリ全体の名前と、最初の画面いっぱいに出す表紙（ふつうは主役の曲の表紙） */
const APP = { title: "ママへの思い", cover: SONGS[0].cover };
</script>
<style>
  :root{
    --bg:#111014;
    --ink:#FFFFFF;
    --band:rgba(12,10,14,.72);
    --btn:#FFD166;      /* ボタンの地（明るい黄色） */
    --btn-ink:#161310;  /* ボタンの文字（ほぼ黒） 明暗差 13:1 */
    --card:#FFFFFF;
    --card-ink:#161310;
    --hint:#FFF6DC;
    --hint-ink:#161310;
    --line:#161310;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
    font-weight:700;line-height:1.45;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  button{font:inherit;color:inherit;border:0;margin:0;cursor:pointer;touch-action:manipulation}
  [hidden]{display:none !important}

  /* ---------- 最初の画面 ---------- */
  .home{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column}
  .home .cover{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
  /* 表紙は画面の上に幅いっぱいで置き、足りない下の部分は同じ画像をぼかして埋める */
  .home .cover .bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);
    object-fit:cover;filter:blur(26px) brightness(.6)}
  .home .cover .fg{position:absolute;left:0;top:0;width:100%;height:auto;max-height:100%;
    object-fit:contain;object-position:50% 0;display:block;
    -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
  .home .cover::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.8))}
  .home .spacer{flex:1 1 auto;min-height:24px}
  .home .front{position:relative;z-index:1;
    padding:0 16px calc(24px + env(safe-area-inset-bottom));
    padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
    display:flex;flex-direction:column;align-items:stretch;gap:20px}
  .title{
    margin:0;align-self:center;text-align:center;
    font-size:clamp(34px,9.5vw,60px);letter-spacing:.06em;line-height:1.25;
    padding:.3em .8em;border-radius:18px;background:var(--band);
    text-shadow:0 2px 6px rgba(0,0,0,.9);
  }
  .play{
    display:flex;align-items:center;justify-content:center;gap:.4em;
    width:100%;max-width:560px;align-self:center;min-height:96px;padding:14px 20px;
    font-size:clamp(30px,8.5vw,44px);letter-spacing:.08em;
    background:var(--btn);color:var(--btn-ink);border-radius:28px;
    box-shadow:0 6px 0 #B98B1C,0 10px 28px rgba(0,0,0,.55);
  }
  .play:active{transform:translateY(4px);box-shadow:0 2px 0 #B98B1C,0 6px 18px rgba(0,0,0,.5)}
  .play .tri{font-size:.85em}
  .play.sub{background:#FFFFFF;min-height:84px;font-size:clamp(28px,7.5vw,38px);box-shadow:0 6px 0 #8C877D,0 10px 28px rgba(0,0,0,.55)}
  /* LINE でこのアプリのリンクを送る（送る側のためのボタン。目立ちすぎないよう小さめ） */
  .sendline{display:flex;align-items:center;justify-content:center;gap:.4em;align-self:center;
    min-height:64px;min-width:64px;padding:0 26px;border-radius:20px;font-size:24px;
    background:#05773A;color:#FFFFFF;border:3px solid #FFFFFF;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .sendline:active{transform:translateY(2px)}

  /* 2曲目から：主役のボタンの下に、小さめのカードで並べる */
  .subs{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
  .subs .cap{font-size:22px;color:#FFFFFF;text-shadow:0 2px 6px #000;margin:0 4px -4px}
  .card{
    width:100%;min-height:100px;display:flex;align-items:center;gap:16px;padding:10px 14px 10px 10px;text-align:left;font-size:24px;
    background:rgba(255,255,255,.94);color:var(--card-ink);border-radius:20px;
    box-shadow:0 4px 0 #8C877D,0 8px 20px rgba(0,0,0,.45);
  }
  .card:active{transform:translateY(3px);box-shadow:0 1px 0 #8C877D}
  .card img{width:80px;height:80px;border-radius:14px;object-fit:cover;object-position:50% 20%;flex:none;background:#333}
  /* 曲名：動画の題名に合わせた欧文の書体で大きく（日本語の曲名は丸ゴシックのまま） */
  .card .t{flex:1;min-width:0;font-size:38px;line-height:1.1;letter-spacing:.02em;
    font-family:Georgia,"Times New Roman","Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:700}
  .card .go{flex:none;display:flex;align-items:center;justify-content:center;min-width:64px;min-height:64px;
    padding:0 14px;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-size:24px;
    border:3px solid var(--line)}

  /* ホーム画面への追加の案内 */
  .hint{
    position:relative;z-index:1;margin:0 16px calc(16px + env(safe-area-inset-bottom));
    background:var(--hint);color:var(--hint-ink);border-radius:22px;padding:18px 18px 16px;
    font-size:24px;line-height:1.5;box-shadow:0 8px 26px rgba(0,0,0,.5);
  }
  .hint p{margin:0 0 12px}
  .hint .lead{font-size:22px}
  .hint .how{font-size:26px}
  .hint .share{display:inline-flex;vertical-align:-6px;width:34px;height:34px;border:3px solid currentColor;
    border-radius:6px;align-items:center;justify-content:center;font-size:22px;line-height:1;margin:0 2px}
  .hint .how.small{font-size:24px}
  .hint .how small{font-size:20px}
  .hint .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .hint button{min-height:64px;min-width:64px;padding:0 22px;border-radius:18px;font-size:24px}
  /* とじる：白地に太い黒枠と ✕ で、はっきりボタンと分かるように */
  .hint .close{background:#FFFFFF;color:var(--hint-ink);border:4px solid var(--line);margin-left:auto;
    min-height:68px;padding:0 24px;box-shadow:0 4px 0 #8C877D}
  .hint .close:active{transform:translateY(3px);box-shadow:0 1px 0 #8C877D}
  /* Android の「ホーム画面に 追加する」：いちばん目立つ大きな黄色 */
  .hint .install{display:flex;align-items:center;justify-content:center;gap:.3em;width:100%;
    min-height:84px;margin:0 0 14px;font-size:28px;white-space:nowrap;background:var(--btn);color:var(--btn-ink);
    border:4px solid var(--line);border-radius:22px;box-shadow:0 5px 0 #B98B1C}
  .hint .install:active{transform:translateY(3px);box-shadow:0 2px 0 #B98B1C}
  /* 案内が出ている間は「もう1曲」と「LINEで 送る」を隠す（主役の曲と案内だけにする） */
  .home.hinting .subs,.home.hinting .sendline{display:none}
  .home.one .front{padding-bottom:20px}

  /* ---------- 再生の画面 ----------
     動画は上、操作ボタンは下の余白にまとめる（横向きのときは右側） */
  .player{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column}
  .player .stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  .player video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .wait,.toast{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
    font-size:28px;text-shadow:0 2px 6px #000,0 0 2px #000}
  .wait{bottom:18%}
  .toast{top:40%;opacity:0;transition:opacity .25s}
  .toast.on{opacity:1}
  .toast span{display:inline-block;padding:.25em .8em;border-radius:16px;background:rgba(0,0,0,.72)}

  .bar{flex:none;padding:10px max(12px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));
    display:flex;flex-direction:column;gap:10px;background:#000}
  .time{display:flex;align-items:center;gap:12px;font-size:22px;color:#fff}
  .time .track{flex:1;height:10px;border-radius:5px;background:#4A4640;overflow:hidden}
  .time .fill{height:100%;width:0;background:var(--btn)}
  .keys{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr;gap:6px}
  .key{min-height:84px;min-width:64px;padding:6px 2px;border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--btn);color:var(--btn-ink);font-size:24px;line-height:1.1;
    box-shadow:0 4px 0 #B98B1C;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .key:active,.key.hold{transform:translateY(3px);box-shadow:0 1px 0 #B98B1C}
  .key svg{width:34px;height:34px;fill:currentColor}
  .key.main svg{width:40px;height:40px}
  .key.exit{background:#FFFFFF;color:#161310;box-shadow:0 4px 0 #8C877D}

  @media (orientation:landscape) and (max-height:600px){
    .player{flex-direction:row}
    .bar{width:min(46vw,300px);padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) 10px;justify-content:center}
    .keys{grid-template-columns:1fr 1fr}
    .key{min-height:72px}
    .key.main{order:-1;grid-column:1 / -1}
  }
</style>
</head>
<body>
<main id="home" class="home">
  <div class="cover"><img class="bg" id="coverBg" alt=""><img class="fg" id="coverImg" alt=""></div>
  <div class="spacer"></div>
  <div class="front" id="front"></div>
  <div class="hint" id="hint" hidden></div>
</main>

<section id="player" class="player" hidden>
  <div class="stage">
    <video id="video" playsinline webkit-playsinline preload="none"></video>
    <p class="wait" id="wait" hidden>よみこみちゅう…</p>
    <p class="toast" id="toast"><span></span></p>
  </div>
  <div class="bar">
    <div class="time" aria-hidden="true"><span id="now">0:00</span><div class="track"><div class="fill" id="fill"></div></div><span id="dur">0:00</span></div>
    <div class="keys">
      <button class="key" id="rew" type="button" aria-label="巻戻し">
        <svg viewBox="0 0 24 24"><path d="M11 6v12L2.5 12zM21 6v12l-8.5-6z"/></svg><span>巻戻し</span></button>
      <button class="key main" id="pp" type="button" aria-label="一時停止">
        <svg viewBox="0 0 24 24" id="ppIcon"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><span id="ppText">一時停止</span></button>
      <button class="key" id="ff" type="button" aria-label="早送り">
        <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/></svg><span>早送り</span></button>
      <button class="key exit" id="back" type="button" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg><span>もどる</span></button>
    </div>
  </div>
</section>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const home = $('#home'), front = $('#front'), player = $('#player'), video = $('#video');
  let current = -1;       // 今の曲（または最後に見た曲）
  let finished = false;   // 最後まで見終わったか
  let resumeAt = 0;       // 途中で「もどる」を押したときの位置

  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);

  /* ---------- 最初の画面を組み立てる ---------- */
  $('#coverImg').src = $('#coverBg').src = APP.cover;
  home.classList.add('one');

  function renderHome() {
    front.textContent = '';
    // 主役（1曲目）
    const h = document.createElement('h1');
    h.className = 'title';
    h.textContent = SONGS[0].title;
    const mk = (text, cls, fromStart) => {
      const b = document.createElement('button');
      b.className = cls;
      b.type = 'button';
      b.innerHTML = '<span class="tri">▶</span><span></span>';
      b.lastChild.textContent = text;
      b.addEventListener('click', () => play(0, fromStart));
      return b;
    };
    front.append(h);
    if (label(0) === '続きを 見る') {
      // 途中で「もどる」を押したとき：上に「最初から」、下に「続き」
      front.append(mk('最初から 見る', 'play', true), mk('続きを 見る', 'play sub', false));
    } else {
      front.append(mk(label(0), 'play', true));
    }
    // 2曲目から（小さめのカード）
    if (SONGS.length > 1) {
      const ul = document.createElement('ul');
      ul.className = 'subs';
      const cap = document.createElement('li');
      cap.className = 'cap';
      cap.textContent = SONGS.length > 2 ? 'ほかの曲' : 'もう1曲';
      ul.append(cap);
      SONGS.forEach((s, i) => {
        if (i === 0) return;
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'card';
        const img = document.createElement('img');
        img.src = s.thumb || s.cover; img.alt = '';
        const t = document.createElement('span');
        t.className = 't'; t.textContent = s.title;
        const go = document.createElement('span');
        go.className = 'go'; go.textContent = '▶ ' + ({ 'もう一度 見る': 'もう一度', '続きを 見る': '続きから' }[label(i)] || '見る');
        b.append(img, t, go);
        b.addEventListener('click', () => play(i));
        li.append(b); ul.append(li);
      });
      front.append(ul);
    }
    front.append(shareButton());
  }
  // LINE を開いて、このアプリのリンクを送る
  function shareButton() {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sendline'; b.id = 'share';
    b.textContent = 'LINEで 送る';
    b.addEventListener('click', () => {
      // openExternalBrowser=1：LINE で押したとき、LINE の中ではなくいつものブラウザ（Safari / Chrome）で開く。
      // そうすると「ホーム画面に追加」ができる（LINE の中の画面ではできない）
      const url = location.origin + location.pathname + '?openExternalBrowser=1';
      const text = APP.title + '\n' + url;
      const line = 'https://line.me/R/share?text=' + encodeURIComponent(text);
      const w = window.open(line, '_blank');
      if (!w) location.href = line;
    });
    return b;
  }
  function label(i) {
    if (i !== current) return '見る';
    if (finished) return 'もう一度 見る';
    if (resumeAt > 5) return '続きを 見る';
    return '見る';
  }

  /* ---------- 再生 ---------- */
  function play(i, fromStart) {
    const s = SONGS[i];
    const same = !fromStart && i === current && !finished && resumeAt > 5;
    // スマホの中にしまってあればそちらから、なければネットから流す
    const want = stored[i] || s.video;
    if (i !== current || video.getAttribute('src') !== want) {
      video.src = want;
      video.poster = s.cover;
    }
    usingStored = !!stored[i];
    clearTimeout(guard);
    if (usingStored) guard = setTimeout(() => { if (video.readyState < 1) fallback(); }, 6000);
    else keep(i);
    current = i; finished = false;
    home.hidden = true; player.hidden = false;
    $('#wait').hidden = false;
    history.pushState({ playing: true }, '');
    if (same) { try { video.currentTime = resumeAt; } catch (e) {} } else { try { video.currentTime = 0; } catch (e) {} }
    video.muted = false;
    const p = video.play();
    if (p && p.catch) p.catch(() => { /* 自動で始まらないときは、下の「再生」を押せば始まる */ $('#wait').hidden = true; });
  }

  // スマホの「全画面表示」には切り替えない。
  //  ・iPhone は下のボタンが隠れる
  //  ・Android は「全画面表示を終了するには…」というお知らせが画面に出て邪魔になる
  // かわりにアプリの画面いっぱいで流す（ホーム画面から開けば、ほぼ全画面になる）
  function exitFull() {
    try { if (video.webkitDisplayingFullscreen && video.webkitExitFullscreen) video.webkitExitFullscreen(); } catch (e) {}
    const fe = document.fullscreenElement || document.webkitFullscreenElement;
    if (fe) {
      const x = document.exitFullscreen || document.webkitExitFullscreen;
      try { const r = x.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) {}
    }
  }

  function backHome(ended) {
    if (player.hidden) return;
    finished = !!ended;
    resumeAt = ended ? 0 : (video.currentTime || 0);
    video.pause();
    exitFull();
    player.hidden = true; home.hidden = false;
    renderHome();
    home.scrollTop = 0;
  }

  video.addEventListener('playing', () => { $('#wait').hidden = true; });

  /* ---------- 動画をスマホの中にしまう ----------
     1回目はネットから流しつつ、裏で動画を丸ごとしまっておく。2回目からはしまった動画から流す
     （通信量がかからない）。しまった動画で流せなかったときは、すぐネットからの再生に切り替える。
     ※ 画面と画像の保存係（sw.js）とは別に、ここで直接しまう（sw.js は動画にはさわらない） */
  const VIDEO_STORE = 'video-store';
  const canStore = 'caches' in window && window.isSecureContext;
  const stored = [];          // しまってある動画（すぐ流せる形）
  const broken = [];          // この回はしまった動画で流せなかった曲
  const saving = [];
  let usingStored = false, guard = 0;
  const abs = u => new URL(u, location.href).href;
  const cellular = () => { const c = navigator.connection; return !!(c && (c.saveData || c.type === 'cellular')); };

  async function loadStored(i) {
    if (!canStore || broken[i]) return;
    try {
      const r = await (await caches.open(VIDEO_STORE)).match(abs(SONGS[i].video));
      if (!r) return;
      const b = await r.blob();
      if (b.size > 100000) stored[i] = URL.createObjectURL(b);
    } catch (e) {}
  }
  async function keep(i) {
    if (!canStore || stored[i] || saving[i] || broken[i] || cellular()) return;
    saving[i] = true;
    try {
      const cache = await caches.open(VIDEO_STORE);
      const url = abs(SONGS[i].video);
      if (!(await cache.match(url))) {
        const r = await fetch(url);
        if (r.status !== 200) return;
        await cache.put(url, r);
      }
      await loadStored(i);
    } catch (e) {
    } finally { saving[i] = false; }
  }
  function fallback() {
    if (!usingStored || current < 0) return;
    usingStored = false; clearTimeout(guard);
    broken[current] = true;
    try { URL.revokeObjectURL(stored[current]); } catch (e) {}
    stored[current] = null;
    const t = video.currentTime || 0;
    video.src = SONGS[current].video;
    try { video.currentTime = t; } catch (e) {}
    const p = video.play();
    if (p && p.catch) p.catch(() => { $('#wait').hidden = true; });
  }
  video.addEventListener('error', () => { if (usingStored) fallback(); });
  video.addEventListener('loadedmetadata', () => clearTimeout(guard));

  (async () => {
    if (!canStore) return;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    try {
      // 差し替え前の古い動画は消す
      const cache = await caches.open(VIDEO_STORE);
      const now = SONGS.map(s => abs(s.video));
      for (const req of await cache.keys()) if (!now.includes(req.url)) await cache.delete(req);
    } catch (e) {}
    for (let i = 0; i < SONGS.length; i++) await loadStored(i);
    // 主役の曲だけは、開いたときに裏でしまっておく（2曲目からは、1回見たときにしまう）
    setTimeout(() => keep(0), 3000);
  })();
  video.addEventListener('ended', () => {
    backHome(true);
    if (history.state && history.state.playing) history.back();
  });
  /* ---------- 下のボタン ---------- */
  const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function showTime() {
    const d = video.duration || 0;
    $('#now').textContent = fmt(video.currentTime);
    $('#dur').textContent = fmt(d);
    $('#fill').style.width = d ? (video.currentTime / d * 100) + '%' : '0';
  }
  function showPP() {
    const paused = video.paused;
    $('#ppIcon').innerHTML = paused ? '<path d="M7 4v16l13-8z"/>' : '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    $('#ppText').textContent = paused ? '再生' : '一時停止';
    $('#pp').setAttribute('aria-label', paused ? '再生' : '一時停止');
  }
  let toastTimer = 0;
  function toast(text, keep) {
    const t = $('#toast');
    t.firstChild.textContent = text; t.classList.add('on');
    clearTimeout(toastTimer);
    if (!keep) toastTimer = setTimeout(() => t.classList.remove('on'), 900);
  }
  function seekBy(sec) {
    const d = video.duration || Infinity;
    try { video.currentTime = Math.min(Math.max(0, video.currentTime + sec), d - 0.3); } catch (e) {}
    showTime();
  }
  ['timeupdate', 'durationchange', 'loadedmetadata', 'seeked'].forEach(ev => video.addEventListener(ev, showTime));
  ['play', 'pause', 'playing'].forEach(ev => video.addEventListener(ev, showPP));

  $('#pp').addEventListener('click', () => {
    if (video.paused) { const p = video.play(); if (p && p.catch) p.catch(() => {}); } else video.pause();
  });

  // 巻戻し・早送り：1回押すと10秒、押し続けるとその間ずっと速く進む（戻る）
  function holdKey(btn, dir) {
    let holdTimer = 0, repeat = 0, held = false, down = false, lastUp = 0;
    const start = e => {
      if (e.button > 0) return;
      e.preventDefault();
      down = true; held = false;
      try { btn.setPointerCapture(e.pointerId); } catch (er) {}
      holdTimer = setTimeout(() => {
        held = true; btn.classList.add('hold');
        toast(dir > 0 ? '▶▶ 早送り中' : '◀◀ 巻戻し中', true);
        repeat = setInterval(() => seekBy(dir * 2), 200);   // 約10倍の速さ
      }, 450);
    };
    const end = () => {
      if (!down) return;
      down = false; lastUp = Date.now();
      clearTimeout(holdTimer); clearInterval(repeat); btn.classList.remove('hold');
      if (held) { $('#toast').classList.remove('on'); return; }
      seekBy(dir * 10);
      toast(dir > 0 ? '10秒 すすめました' : '10秒 もどしました');
    };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', end);
    btn.addEventListener('pointercancel', end);
    btn.addEventListener('lostpointercapture', end);
    btn.addEventListener('contextmenu', e => e.preventDefault());
    // キーボード操作（Enter など）のとき。指で押したあとに続けて届く click は数えない
    btn.addEventListener('click', e => { if (e.detail === 0 && Date.now() - lastUp > 800) { seekBy(dir * 10); toast(dir > 0 ? '10秒 すすめました' : '10秒 もどしました'); } });
  }
  holdKey($('#rew'), -1);
  holdKey($('#ff'), 1);

  $('#back').addEventListener('click', () => {
    if (history.state && history.state.playing) history.back(); else backHome(false);
  });
  // Android の「戻る」ボタンでも最初の画面へ
  addEventListener('popstate', () => { if (!player.hidden) backHome(video.ended); });

  renderHome();

  /* ---------- ホーム画面への追加の案内 ----------
     ブラウザで開いたときは毎回出す（「とじる」はその回だけ消す）。ホーム画面から開いたときは出さない。
     案内が出ている間は「もう1曲」と「LINEで 送る」を隠す */
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let closed = false;
  const hint = $('#hint');
  let installEvt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showHint(); });
  function hideHint() {
    closed = true; hint.hidden = true;
    home.classList.remove('hinting');
  }
  function showHint() {
    if (standalone || closed || !(isIOS || isAndroid)) return;
    hint.innerHTML = '';
    const lead = document.createElement('p');
    lead.className = 'lead';
    lead.textContent = isIOS ? 'ホーム画面に置くと、つぎから すぐ開けます' : 'ホーム画面に追加すると、次から すぐ開けます';
    const parts = [lead];
    if (isIOS) {
      // iPhone は自分で操作するしかないので、手順をしっかり見せる
      const how = document.createElement('p');
      how.className = 'how';
      how.innerHTML = '下の 共有ボタン<span class="share" aria-hidden="true">↑</span><br>を押して<br>→『ホーム画面に追加』';
      parts.push(how);
    } else if (installEvt) {
      // Android（Chrome）：ボタン1つで追加できる
      const ib = document.createElement('button');
      ib.type = 'button'; ib.className = 'install'; ib.textContent = '＋ ホーム画面に追加';
      ib.addEventListener('click', async () => {
        const e = installEvt; installEvt = null;
        try { await e.prompt(); const r = await e.userChoice; if (r && r.outcome === 'accepted') { hideHint(); return; } } catch (er) {}
        showHint();
      });
      parts.push(ib);
    } else {
      const how = document.createElement('p');
      how.className = 'how small';
      how.innerHTML = '右上の ︙ を押して<br>→『ホーム画面に追加』<br><small>※『インストール』と出ることも</small>';
      parts.push(how);
    }
    const row = document.createElement('div');
    row.className = 'row';
    const cb = document.createElement('button');
    cb.type = 'button'; cb.className = 'close'; cb.textContent = '✕ とじる';
    cb.addEventListener('click', hideHint);
    row.append(cb);
    hint.append(...parts, row);
    hint.hidden = false;
    home.classList.add('hinting');
  }
  addEventListener('appinstalled', hideHint);
  showHint();

  /* ---------- 画面と画像を保存（動画は保存しない） ---------- */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
